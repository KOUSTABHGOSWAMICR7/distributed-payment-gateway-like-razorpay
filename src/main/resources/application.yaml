spring:
  application:
    name: razorpay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorpayDB}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:2468}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  payment:
    simulator:
      poll-interval-ms: 5000
      chaos-mode: NORMAL
      methods:
        CARD:
          min-delay-seconds: 2
          max-delay-seconds: 6
          success-rate: 90
        UPI:
          min-delay-seconds: 1
          max-delay-seconds: 3
          success-rate: 95
        NET_BANKING:
          min-delay-seconds: 4
          max-delay-seconds: 10
          success-rate: 80

jwt:
  secret-key: dont-use-in-prod-a9asd7fulasjdfaklsdfu98q3uhjdiosh897as9d8f7ua9osufdjilasdjf

vault:
  master-key: NqcfbJG1zkOfBsNF/wPmlLA7aaOvh9RCHTYYgY/9A2Q=

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 2